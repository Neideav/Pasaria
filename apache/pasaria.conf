<VirtualHost *:80>
    # -------------------------------------------------------------------------
    # PASARIA Marketplace — Apache2 VirtualHost Configuration
    # -------------------------------------------------------------------------
    ServerName pasaria.id
    ServerAlias www.pasaria.id
    ServerAdmin webmaster@pasaria.id

    # DocumentRoot points to Laravel public folder (containing React SPA index.html)
    DocumentRoot /var/www/pasaria/public

    <Directory /var/www/pasaria/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Restrict direct access to project root and sensitive directories
    <Directory /var/www/pasaria>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/pasaria/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/pasaria_error.log
    CustomLog ${APACHE_LOG_DIR}/pasaria_access.log combined

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>
