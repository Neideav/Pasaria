<VirtualHost *:80>
    ServerName localhost
    ServerAlias www.localhost
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/shopcart/public

    <Directory /var/www/shopcart/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/shopcart_error.log
    CustomLog ${APACHE_LOG_DIR}/shopcart_access.log combined

    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>
</VirtualHost>
