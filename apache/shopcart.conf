<VirtualHost *:80>
    ServerName localhost
    # Ganti dengan domain Anda atau Public IP / Public DNS AWS EC2:
    # ServerName ec2-xx-xx-xx-xx.compute-1.amazonaws.com

    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/shopcart/public

    <Directory /var/www/shopcart/public>
        Options -Indexes +FollowSymLinks
        # PENTING: AllowOverride All diperlukan agar .htaccess Laravel berfungsi
        AllowOverride All
        Require all granted
    </Directory>

    # Custom Log Files
    ErrorLog ${APACHE_LOG_DIR}/shopcart_error.log
    CustomLog ${APACHE_LOG_DIR}/shopcart_access.log combined

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
    </IfModule>
</VirtualHost>
