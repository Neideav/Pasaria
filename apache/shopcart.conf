<VirtualHost *:80>
    # -------------------------------------------------------------------------
    # Ganti 'your-domain.com' dengan domain / Public IP EC2 Anda
    # -------------------------------------------------------------------------
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin webmaster@your-domain.com

    # DocumentRoot mengarah ke subfolder /public milik Laravel
    DocumentRoot /var/www/shopcart/public

    <Directory /var/www/shopcart/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Jangan expose direktori selain /public
    <Directory /var/www/shopcart>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/shopcart/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/shopcart_error.log
    CustomLog ${APACHE_LOG_DIR}/shopcart_access.log combined

    # Security Headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>
</VirtualHost>
