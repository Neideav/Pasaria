name: PASARIA CI/CD Pipeline

on:
  push:
    branches:
      - main
      - production
  pull_request:
    branches:
      - main
      - production

jobs:
  test-and-build:
    name: Test & Build (Laravel + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run Backend PHPUnit Tests
        run: vendor/bin/phpunit

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend Typecheck & Lint
        run: npm run lint

      - name: Frontend Production Build
        run: npm run build

  deploy:
    name: Deploy to EC2 Production
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy to Production Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ -f /var/www/pasaria/auto-deploy.sh ]; then
              bash /var/www/pasaria/auto-deploy.sh
            elif [ -f /var/www/shopcart/auto-deploy.sh ]; then
              bash /var/www/shopcart/auto-deploy.sh
            else
              echo "Error: Deployment script not found!"
              exit 1
            fi
