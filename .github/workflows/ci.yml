name: PASARIA CI (Continuous Integration)

on:
  push:
    branches:
      - testing
      - main
  pull_request:
    branches:
      - testing
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-quality-gate:
    name: Backend CI (PHP 8.2 & Laravel 11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath
          coverage: none

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHP Syntax Check (Linting)
        run: |
          LINT_ERRORS=0
          find app config routes database -type f -name "*.php" | while read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Syntax error in $file"
              LINT_ERRORS=$((LINT_ERRORS + 1))
            fi
          done
          exit $LINT_ERRORS

      - name: Verify Route Matrix Compilation
        run: php artisan route:list

      - name: Run Automated Test Suite (In-Memory SQLite)
        run: vendor/bin/phpunit --no-coverage

  frontend-quality-gate:
    name: Frontend CI (Node 22 & React 19)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci --legacy-peer-deps

      - name: Frontend Typecheck & Lint (tsc --noEmit)
        run: npm run lint

      - name: Frontend Production Bundle Build
        run: npm run build

  docker-image-build:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-quality-gate, frontend-quality-gate]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Dry Run Verification)
        run: docker build --no-cache -t pasaria:ci-test .
