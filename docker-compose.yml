version: '3.8'

services:
  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: shopcart_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/shopcart
      - ./nginx/docker-nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shopcart_network

  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopcart_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/shopcart
    networks:
      - shopcart_network
    depends_on:
      - mariadb

  # MariaDB Database (Bisa digunakan lokal atau diganti dengan AWS RDS MariaDB)
  mariadb:
    image: mariadb:10.11
    container_name: shopcart_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: shopcart
      MYSQL_USER: shopcart_user
      MYSQL_PASSWORD: shopcart_password_123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - shopcart_network

networks:
  shopcart_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
