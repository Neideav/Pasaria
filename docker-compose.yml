services:

  pasaria:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: pasaria
    restart: unless-stopped

    ports:
      - "80:80"

    env_file:
      - .env

    volumes:
      # Persistent volume for application storage, cache, session data, and media uploads
      - pasaria-storage:/var/www/html/storage
      - ./.env:/var/www/html/.env
      - type: bind
        source: /var/www/pasaria/certs/ap-southeast-1-bundle.pem
        target: /etc/ssl/rds/ap-southeast-1-bundle.pem
        read_only: true

    networks:
      - pasaria-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  pasaria-network:
    driver: bridge

volumes:
  # Named volume preserves data across container updates and restarts
  pasaria-storage:
    name: pasaria_storage_volume
